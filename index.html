<script>
const RENDER_BASE_URL = "PASTE_YOUR_RENDER_URL_HERE";
const API_URL =
  RENDER_BASE_URL.replace(/\/+$/, "") + "/api/check";

async function detectMedia() {
  const input = document.getElementById("mediaURL");
  const result = document.getElementById("result");
  const value = input.value.trim();

  result.style.display = "block";
  result.textContent = "Checking your link...";

  if (!value) {
    result.textContent = "Please paste a URL first.";
    return;
  }

  try {
    const parsed = new URL(value);

    if (parsed.protocol !== "https:") {
      result.textContent = "Only HTTPS links are accepted.";
      return;
    }
  } catch {
    result.textContent = "Invalid URL. Please check your link.";
    return;
  }

  try {
    const response = await fetch(API_URL, {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({ url: value })
    });

    const data = await response.json();

    if (!response.ok || !data.success) {
      result.textContent =
        data.message || "Unable to verify this link.";
      return;
    }

    result.textContent = "";

    const heading = document.createElement("strong");
    heading.textContent =
      "Platform detected: " + data.platform;

    const message = document.createElement("p");
    message.textContent =
      "Your link was checked by MEDIAX backend.";

    const notice = document.createElement("p");
    notice.textContent =
      "Actual downloading is not connected yet.";

    result.append(heading, message, notice);

  } catch (error) {
    result.textContent =
      "Unable to connect to MEDIAX server. Please try again.";
  }
}
</script>
